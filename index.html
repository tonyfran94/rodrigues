<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nu Sirop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffe29f, #ffa99f);
      color: #333;
    }

    .container {
      padding: 30px;
      max-width: 800px;
      margin: auto;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      margin-top: 40px;
    }

    h1, h2 {
      text-align: center;
    }

    .menu {
      margin-top: 30px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }

    .map {
      margin: 30px 0;
      text-align: center;
    }

    .address {
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nu Sirop</h1>
    <p>Your spot for cozy coffee and good vibes.</p>

    <div class="menu">
      <h2>Menu</h2>
      <div class="menu-item">
        <span>Espresso</span><span>$2.50</span>
      </div>
      <div class="menu-item">
        <span>Cappuccino</span><span>$3.00</span>
      </div>
      <div class="menu-item">
        <span>Avocado Toast</span><span>$4.50</span>
      </div>
      <div class="menu-item">
        <span>Blueberry Muffin</span><span>$2.25</span>
      </div>
    </div>

    <div class="map">
      <h2>Find Us</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.7478792662383!2d-80.1353!3d26.1224!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88d901c08394624f%3A0xabcdef1234567890!2sMy+Cool+Cafe!5e0!3m2!1sen!2sus!4v123456789"
        width="100%"
        height="300"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
      </iframe>
    </div>

    <div class="address">
      📍 123 Beachside Blvd, Fort Lauderdale, FL 33301
    </div>
  </div>
</body>
</html>
